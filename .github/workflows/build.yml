# Builds the Windows and Linux apps.
# - Every push and pull request: builds them and keeps them as a downloadable artifact.
# - Pushing a version tag (for example v1.0.0): also attaches them to a GitHub Release.
name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: pip install py7zr

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: roll-and-hero-apps
          path: |
            releases/RollAndHero-Windows.7z
            releases/RollAndHero-Linux.tar.xz

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/RollAndHero-Windows.7z
            releases/RollAndHero-Linux.tar.xz
